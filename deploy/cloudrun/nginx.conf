# nginx site config for Cloud Run (included inside the stock http {} block).
# Mirrors netlify.toml: same security headers and cache rules, plus GitHub Pages-style 404 handling
# (unknown paths get 404.html, which is the app shell, with a 404 status).

# Cloud Run terminates TLS and forwards X-Forwarded-Proto: https. Only then upgrade requests and
# send HSTS, so the same image also works over plain http://localhost for local testing.
map $http_x_forwarded_proto $csp_upgrade { https "; upgrade-insecure-requests"; default ""; }
map $http_x_forwarded_proto $hsts        { https "max-age=31536000"; default ""; }

# Content-hashed build output (Vite chunks, portfolio fonts) is immutable; everything else revalidates.
map $uri $cache_control {
  ~^/assets/  "public, max-age=31536000, immutable";
  default     "no-cache";
}

# www.example.com -> example.com (one canonical host when both are mapped to the service).
map $host $apex_host { ~^www\.(?<apex>.+)$ $apex; default ""; }

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  absolute_redirect off;   # /portfolio -> /portfolio/ as a relative redirect (no internal port/scheme)

  if ($apex_host) { return 301 https://$apex_host$request_uri; }

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json application/manifest+json
             image/svg+xml application/xml text/xml text/plain application/wasm;

  # CSP: same-origin only; inline styles (React style attributes, the static page's <style>);
  # data:/blob: for generated textures, audio and worker scripts; 'wasm-unsafe-eval' for Rapier.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; media-src 'self' data: blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'$csp_upgrade" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Strict-Transport-Security $hsts always;
  add_header Cache-Control $cache_control always;

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
