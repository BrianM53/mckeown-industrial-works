# Build, verify and deploy the site to GitHub Pages:
#   https://brianm53.github.io/mckeown-industrial-works/
#
# One-time repository setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The site needs no secrets. For a custom domain, change SITE_URL (and PAGES_BASE_PATH to "/") below.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Base path and public URL of the GitHub Pages project site. BASE_PATH itself is set only on
  # the build and preview steps, so the unit tests run with the same base ("/") as locally.
  PAGES_BASE_PATH: /mckeown-industrial-works/
  SITE_URL: https://brianm53.github.io/mckeown-industrial-works/

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # CI runners are slower than dev machines: give jsdom-heavy tests more than the 5 s default.
      - name: Unit tests
        run: npm test -- --testTimeout=20000

      - name: Build (Vite + static portfolio prerender)
        run: npm run build
        env:
          BASE_PATH: ${{ env.PAGES_BASE_PATH }}

      - name: Smoke-test the build
        env:
          BASE_PATH: ${{ env.PAGES_BASE_PATH }}
        run: |
          npx vite preview --port 4173 --strictPort &
          node scripts/smoke.mjs "http://127.0.0.1:4173${BASE_PATH}" --wait 30000

      - name: Check link syntax
        run: npx tsx scripts/check-links.ts

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Fetch the smoke test
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/smoke.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Smoke-test the live site
        run: node scripts/smoke.mjs "${{ steps.deployment.outputs.page_url }}" --wait 120000 --retries 4
