# Pull-request / branch checks: the same gates as the deploy build, without deploying.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # CI runners are slower than dev machines: give jsdom-heavy tests more than the 5 s default.
      - name: Unit tests
        run: npm test -- --testTimeout=20000

      - name: Build (Vite + static portfolio prerender)
        run: npm run build

      - name: Smoke-test the build
        run: |
          npx vite preview --port 4173 --strictPort &
          node scripts/smoke.mjs http://127.0.0.1:4173/ --wait 30000

      - name: Check link syntax
        run: npx tsx scripts/check-links.ts
