# Netlify deployment (alternative to GitHub Pages; see .github/workflows/deploy.yml).
# Build: Vite + static portfolio prerender. No secrets needed.
# SITE_URL defaults to Netlify's production URL ($URL) when unset; set it for a custom domain.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  BASE_PATH = "/"

# SPA fallback for unknown paths. Netlify serves existing files first (no `force`), so
# /portfolio/, /assets/*, /health.json etc. are never shadowed.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every response.
# CSP: everything same-origin; inline styles (React style attributes, the static page's <style>);
# data:/blob: for generated textures, audio and worker scripts (drei Text runs troika in blob
# workers that importScripts() blob URLs); 'wasm-unsafe-eval' for the Rapier physics WASM.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; media-src 'self' data: blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"

# Content-hashed build output (Vite chunks, portfolio fonts): cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML, crawler files and the health check: always revalidate.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/404.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/portfolio/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/health.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "no-cache"
